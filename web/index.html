<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111310">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https:; media-src https:; connect-src 'self'; object-src 'none'; base-uri 'none'">
  <title>OnionPod</title>
  <link rel="icon" type="image/png" sizes="32x32" href="icons/onionpod-32.png">
  <link rel="apple-touch-icon" href="icons/onionpod-180.png">
  <link rel="manifest" href="site.webmanifest">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <svg hidden xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-discover" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5z"/></symbol>
    <symbol id="i-categories" viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></symbol>
    <symbol id="i-library" viewBox="0 0 24 24"><path d="M5 4v16M10 4v16M14.5 5l4.5 14.5"/></symbol>
    <symbol id="i-inbox" viewBox="0 0 24 24"><path d="M4 13h4.5l1.5 2.5h4l1.5-2.5H20"/><path d="M6.5 5h11L20 13v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-5z"/></symbol>
    <symbol id="i-queue" viewBox="0 0 24 24"><path d="M4 6h16M4 11h16M4 16h8"/><path d="m15 14.5 5 3-5 3z"/></symbol>
    <symbol id="i-downloads" viewBox="0 0 24 24"><path d="M12 4v11m-4.5-4.5L12 15l4.5-4.5M5 20h14"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6.5" y="5" width="4" height="14" rx="1.2" fill="currentColor" stroke="none"/><rect x="13.5" y="5" width="4" height="14" rx="1.2" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-rewind" viewBox="0 0 24 24"><path d="M4.5 4.5V9H9"/><path d="M5 9a8 8 0 1 1-1 4.5"/></symbol>
    <symbol id="i-forward" viewBox="0 0 24 24"><path d="M19.5 4.5V9H15"/><path d="M19 9a8 8 0 1 0 1 4.5"/></symbol>
    <symbol id="i-volume" viewBox="0 0 24 24"><path d="M4 9.5v5h3.5L12 19V5L7.5 9.5zM15.5 9a4 4 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11"/></symbol>
    <symbol id="i-volume-low" viewBox="0 0 24 24"><path d="M4 9.5v5h3.5L12 19V5L7.5 9.5zM15.5 9a4 4 0 0 1 0 6"/></symbol>
    <symbol id="i-muted" viewBox="0 0 24 24"><path d="M4 9.5v5h3.5L12 19V5L7.5 9.5zM16 9.5l5 5M21 9.5l-5 5"/></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 19.5S4 15 4 9.2A4.2 4.2 0 0 1 12 7a4.2 4.2 0 0 1 8 2.2C20 15 12 19.5 12 19.5z"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 19V5m-6 6 6-6 6 6"/></symbol>
    <symbol id="i-retry" viewBox="0 0 24 24"><path d="M19.5 4.5V9H15"/><path d="M19 9a8 8 0 1 0 1 4.5"/></symbol>
    <symbol id="i-queue-add" viewBox="0 0 24 24"><path d="M4 6h16M4 11h10M4 16h8M18 13v8M14 17h8"/></symbol>
    <symbol id="i-queued" viewBox="0 0 24 24"><path d="M4 6h16M4 11h10M4 16h7m3 1 2.5 2.5 5-5"/></symbol>
    <symbol id="i-notes" viewBox="0 0 24 24"><path d="M6 3.5h9l3 3v14H6zM9 10h6M9 13.5h6M9 17h4"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="m14.5 5.5-6.5 6.5 6.5 6.5"/></symbol>
    <symbol id="i-sync" viewBox="0 0 24 24"><path d="M5 10a7 7 0 0 1 12-3l2 2m0-5v5h-5M19 14a7 7 0 0 1-12 3l-2-2m0 5v-5h5"/></symbol>
  </svg>
  <aside class="sidebar">
    <div class="brand"><img class="brand-icon" src="icons/onionpod-192.png" alt=""> OnionPod</div>
    <nav aria-label="Main navigation">
      <button data-page="discover" aria-current="page"><svg class="icon" aria-hidden="true"><use href="#i-discover"></use></svg> Discover</button>
      <button data-page="categories"><svg class="icon" aria-hidden="true"><use href="#i-categories"></use></svg> Categories</button>
      <button data-page="library"><svg class="icon" aria-hidden="true"><use href="#i-library"></use></svg> Library</button>
      <button data-page="inbox"><svg class="icon" aria-hidden="true"><use href="#i-inbox"></use></svg> Inbox</button>
      <button data-page="queue"><svg class="icon" aria-hidden="true"><use href="#i-queue"></use></svg> Queue <small id="queue-count"></small></button>
      <button data-page="downloads" hidden><svg class="icon" aria-hidden="true"><use href="#i-downloads"></use></svg> Downloads</button>
    </nav>
    <div class="sidebar-bottom"><span></span> OnionPod <small>v0.1</small></div>
  </aside>
  <main id="main">
    <header class="topbar"><div class="topbar-start"><button id="app-back" class="back" hidden><svg class="icon" aria-hidden="true"><use href="#i-back"></use></svg>Back</button><img class="topbar-brand" src="icons/onionpod-192.png" alt=""><span id="section-label">Discover</span></div><div class="topbar-actions"><button id="open-sync" class="outline"><svg class="icon" aria-hidden="true"><use href="#i-sync"></use></svg>Sync</button><button id="add-feed" class="outline" aria-label="Add RSS feed"><svg class="icon" aria-hidden="true"><use href="#i-plus"></use></svg><span><span class="wide-label">Add </span>RSS<span class="wide-label"> feed</span></span></button></div></header>
    <div id="content" class="content"></div>
    <p id="notice" role="status" hidden></p>
  </main>
  <footer class="player" aria-label="Playback">
    <div class="now">
      <div id="now-cover" class="mini-cover" aria-hidden="true"><img src="icons/onionpod-192.png" alt=""></div>
      <div><strong id="now-title">Nothing playing</strong><small id="now-show">Choose an episode to start</small></div>
    </div>
    <div class="transport">
      <div class="controls">
        <button id="rewind" class="skip" aria-label="Back 15 seconds" title="Back 15 seconds"><svg class="icon" aria-hidden="true"><use href="#i-rewind"></use></svg><small>15</small></button>
        <button id="toggle" class="play" aria-label="Play"><svg class="icon" aria-hidden="true"><use href="#i-play"></use></svg></button>
        <button id="forward" class="skip" aria-label="Forward 30 seconds" title="Forward 30 seconds"><svg class="icon" aria-hidden="true"><use href="#i-forward"></use></svg><small>30</small></button>
      </div>
      <div class="timeline">
        <span id="elapsed">0:00</span><input id="seek" aria-label="Playback position" type="range" step="1" value="0"><span id="duration">0:00</span>
      </div>
    </div>
    <div class="player-tools">
      <div id="volume-control" class="volume">
        <button id="mute" type="button" aria-label="Mute" aria-pressed="false" title="Mute"><svg class="icon" aria-hidden="true"><use href="#i-volume"></use></svg></button>
        <input id="volume" aria-label="Volume" type="range" min="0" max="1" step="0.01" value="1">
      </div>
      <label class="speed"><span class="sr-only">Playback speed</span><select id="rate" aria-label="Playback speed">
        <option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option>
        <option value="1.5">1.5×</option><option value="1.75">1.75×</option><option value="2">2×</option>
      </select></label>
    </div>
  </footer>
  <dialog id="feed-dialog">
    <form id="feed-form">
      <h2>Add RSS feed</h2>
      <label for="feed-url">Podcast feed URL</label>
      <input id="feed-url" type="url" placeholder="https://example.com/podcast.xml" required>
      <div class="dialog-actions"><button class="outline" type="button" id="cancel-feed">Cancel</button><button class="primary">Open feed</button></div>
    </form>
  </dialog>
  <dialog id="sync-dialog" aria-labelledby="sync-title">
    <h2 id="sync-title">Device sync</h2>
    <p id="sync-status" class="meta" role="status"></p>
    <form id="sync-form">
      <label for="sync-password">OnionPod sync password</label>
      <input id="sync-password" type="password" autocomplete="current-password" required maxlength="256">
      <button id="sign-in" class="primary">Sign in</button>
    </form>
    <div id="sync-controls" class="dialog-actions" hidden>
      <button id="sync-now" class="primary" type="button">Sync now</button>
      <button id="sign-out" class="outline" type="button">Sign out</button>
    </div>
    <div class="dialog-actions"><button id="close-sync" class="outline" type="button">Close</button></div>
  </dialog>
</body>
</html>
