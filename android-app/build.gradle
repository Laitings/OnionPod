plugins {
    id 'com.android.application' version '9.1.1'
}
def syncOrigin = providers.gradleProperty('onionpodSyncOrigin')
    .getOrElse('')
if (syncOrigin && !(syncOrigin ==~ /https:\/\/[A-Za-z0-9.-]+(:[0-9]{1,5})?/)) {
    throw new GradleException('onionpodSyncOrigin must be an HTTPS origin.')
}

android {
    namespace 'app.onionpod'
    compileSdk { version = release(37) { minorApiLevel = 0 } }

    defaultConfig {
        applicationId 'app.onionpod'
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
        buildConfigField 'String', 'SYNC_ORIGIN', '"' + syncOrigin + '"'
    }

    sourceSets.main.assets.srcDir('../web')
    buildFeatures { buildConfig = true }
}

dependencies {
    implementation 'androidx.activity:activity:1.13.0'
    implementation 'androidx.webkit:webkit:1.15.0'
    implementation 'androidx.media3:media3-exoplayer:1.9.3'
    implementation 'androidx.media3:media3-session:1.9.3'
}
